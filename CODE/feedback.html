<section>

    <h2>Student Feedback</h2>

    <p>Please share your valuable feedback to improve StudentHub.</p>

    <form>

        <label>Full Name:</label><br>
        <input type="text">

        <br><br>

        <label>Enrollment Number:</label><br>
        <input type="text">

        <br><br>

        <label>Email:</label><br>
        <input type="email">

        <br><br>

        <label>Rate StudentHub:</label><br>

        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average
        <input type="radio" name="rating"> Poor

        <br><br>

        <label>Your Feedback:</label><br>

        <textarea rows="5" cols="40"></textarea>

        <br><br>

        <button type="button" onclick="submitFeedback()">
            Submit
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</section>
